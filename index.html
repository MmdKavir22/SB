<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="midnight">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyBlock Flip Scanner</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<aside id="sidebar">
  <div class="brand">⚡ Flip Scanner</div>
  <nav>
    <button data-view="dashboard" class="active" data-i18n="dashboard"></button>
    <button data-view="ranking" data-i18n="ranking"></button>
    <button data-view="bazaar" data-i18n="bazaar"></button>
    <button data-view="auction" data-i18n="auction"></button>
    <button data-view="bits" data-i18n="bits"></button>
    <button data-view="simulator" data-i18n="simulator"></button>
    <button data-view="history" data-i18n="history"></button>
    <button data-view="settings" data-i18n="settings"></button>
  </nav>
  <div class="side-foot">
    <button id="scanNow" class="primary" data-i18n="scanNow"></button>
    <button id="toggleAuto" data-i18n="startAuto"></button>
    <div id="scanState" class="muted small"></div>
  </div>
</aside>
<div id="content">
<header id="topbar">
  <button id="sideToggle" aria-label="menu">☰</button>
  <label class="inl"><span data-i18n="budgetCoins"></span><input id="budCoins" type="number" min="0" placeholder="∞" title="0 / empty = no limit"></label>
  <label class="inl"><span data-i18n="budgetBits"></span><input id="budBits" type="number" min="0" placeholder="∞" title="0 / empty = no limit"></label>
  <span class="grow"></span>
  <button id="langBtn"></button>
</header>
<main>
<section id="view-dashboard" class="view active">
  <h1 data-i18n="dashboard"></h1>
  <div id="statusRow" class="cards"></div>
  <div id="statCards" class="cards"></div>
  <div class="grid2">
    <div class="card"><h3 data-i18n="chCat"></h3><canvas id="chCategory"></canvas></div>
    <div class="card"><h3 data-i18n="chDist"></h3><canvas id="chDist"></canvas></div>
    <div class="card"><h3 data-i18n="chTop"></h3><canvas id="chTop"></canvas></div>
    <div class="card"><h3 data-i18n="chBest"></h3><canvas id="chBest"></canvas><p id="chBestNote" class="muted small"></p></div>
  </div>
</section>
<section id="view-ranking" class="view">
  <h1 data-i18n="ranking"></h1>
  <div class="filters">
    <input id="fSearch" data-i18n-ph="search">
    <select id="fCategory"><option value="" data-i18n="allCat"></option><option value="Bazaar">Bazaar</option><option value="Auction House">Auction House</option><option value="Bits">Bits</option></select>
    <select id="fRisk"><option value="" data-i18n="anyRisk"></option><option value="low" data-i18n="lowRisk"></option><option value="medium" data-i18n="medRisk"></option></select>
    <label><span data-i18n="maxInvest"></span><input id="fMax" type="number" min="0" placeholder="coins"></label>
    <label><span data-i18n="minLiq"></span><input id="fLiq" type="number" min="0" max="100" value="0"></label>
  </div>
  <div id="tblRanking" class="tablewrap"></div>
</section>
<section id="view-bazaar" class="view"><h1 data-i18n="bazaar"></h1>
  <div class="filters"><input class="search" data-for="bazaar" data-i18n-ph="search">
    <div class="seg" id="bzMode"><button data-mode="cards" class="active" data-i18n="cards"></button><button data-mode="table" data-i18n="table"></button></div></div>
  <div id="tblBazaar"></div></section>
<section id="view-auction" class="view"><h1 data-i18n="auction"></h1>
  <p class="notice" data-i18n="auctionNotice"></p>
  <input class="search" data-for="auction" data-i18n-ph="search"><div id="tblAuction" class="tablewrap"></div></section>
<section id="view-bits" class="view"><h1 data-i18n="bits"></h1><p class="muted small" data-i18n="bitsNote"></p>
  <div class="filters"><input class="search" data-for="bits" data-i18n-ph="search">
    <div class="seg" id="bitsMode"><button data-mode="cards" class="active" data-i18n="cards"></button><button data-mode="table" data-i18n="table"></button></div></div>
  <div id="tblBits"></div></section>
<section id="view-simulator" class="view"><h1 data-i18n="simulator"></h1>
  <div class="grid2">
    <form id="simForm" class="card" onsubmit="return false">
      <label><span data-i18n="simCoins"></span><input id="sCoins" type="number" min="0" value="1000000"></label>
      <label><span data-i18n="simItem"></span><input id="sItem" list="itemList"></label><datalist id="itemList"></datalist>
      <label><span data-i18n="simBuy"></span><input id="sBuy" type="number" min="0" step="any"></label>
      <label><span data-i18n="simSell"></span><input id="sSell" type="number" min="0" step="any"></label>
      <label><span data-i18n="simQty"></span><input id="sQty" type="number" min="0"></label>
      <label><span data-i18n="simVenue"></span><select id="sVenue"><option value="bazaar">Bazaar</option><option value="auction">Auction House</option><option value="none" data-i18n="noFee"></option></select></label>
      <button id="simGo" class="primary" data-i18n="calc"></button>
    </form>
    <div class="card"><h3 data-i18n="result"></h3><div id="simOut" class="muted" data-i18n="simHint"></div>
      <p class="muted small" data-i18n="simWarn"></p></div>
  </div>
</section>
<section id="view-history" class="view"><h1 data-i18n="history"></h1>
  <p class="notice" data-i18n="histNotice"></p>
  <div class="filters"><select id="hItem"></select><span id="hInfo" class="muted small"></span></div>
  <div class="card"><canvas id="chHist"></canvas></div>
  <h3 data-i18n="changes"></h3><div id="hDiff" class="muted small"></div>
</section>
<section id="view-settings" class="view"><h1 data-i18n="settings"></h1>
  <div class="grid2">
    <form class="card" onsubmit="return false" id="setForm">
      <h3 data-i18n="scanner"></h3>
      <label><span data-i18n="setInterval"></span><input id="setInterval" type="number" min="30"></label>
      <label><span data-i18n="setMinProfit"></span><input id="setMinProfit" type="number"></label>
      <label><span data-i18n="setMinRoi"></span><input id="setMinRoi" type="number"></label>
      <label><span data-i18n="setMinVol"></span><input id="setMinVol" type="number" min="0"></label>
      <label><span data-i18n="setMaxAge"></span><input id="setMaxAge" type="number" min="30"></label>
      <label class="row"><input id="setAuction" type="checkbox"><span data-i18n="setAuction"></span></label>
      <h3 data-i18n="fees2"></h3>
      <label><span data-i18n="setBzTax"></span><input id="setBzTax" type="number" step="0.01" min="0"></label>
      <label><span data-i18n="setAhClaim"></span><input id="setAhClaim" type="number" step="0.01" min="0"></label>
      <label><span data-i18n="setAhCap"></span><input id="setAhCap" type="number" min="0"></label>
      <label><span data-i18n="theme"></span><select id="setTheme"><option value="dark" data-i18n="themeDark"></option><option value="midnight" data-i18n="themeMid"></option></select></label>
      <button id="saveSettings" class="primary" data-i18n="save"></button>
    </form>
    <div class="card"><h3 data-i18n="bitsItems"></h3>
      <div id="bitsEditor"></div>
      <div class="row"><input id="bitsId" placeholder="BAZAAR_ITEM_ID"><input id="bitsCost" type="number" min="1" placeholder="Bits"><button id="bitsAdd" data-i18n="addUpdate"></button></div>
      <h3 data-i18n="sources"></h3>
      <p class="small muted">api.hypixel.net/v2/skyblock/bazaar<br>api.hypixel.net/v2/skyblock/auctions<br><span data-i18n="sourcesTxt"></span></p>
      <h3 data-i18n="localData"></h3>
      <button id="clearHistory" data-i18n="clearHist"></button> <button id="resetAll" class="danger" data-i18n="resetAll"></button>
    </div>
  </div>
</section>
</main>
</div>
<div id="hbar" hidden title="scroll"><div id="hbarInner"></div></div>
<div id="toasts"></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
